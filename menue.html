<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Test — YamYam Berlin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="global.css">
  <link rel="stylesheet" href="cookie-banner.css">
  <style>
    .menu-pdf {
      max-width: var(--page-width);
      margin: 24px auto;
      padding: 0 var(--gap);
    }
    .menu-pdf__frame {
      width: 100%;
      height: calc(100vh - var(--nav-height) - 48px);
      min-height: 600px;
      border: 1px solid var(--gray-light);
      background: var(--bg);
    }
    .menu-pdf__fallback {
      font-family: var(--font-body);
      font-size: 14px;
    }
    @media (max-width: 900px) {
      .menu-pdf {
        margin: 16px auto;
        padding: 0 16px;
      }
      .menu-pdf__frame {
        height: calc(100vh - var(--nav-height) - 32px);
      }
    }
  </style>
</head>
<body style="padding-top: var(--nav-height)">

  <nav class="site-nav" role="navigation" aria-label="Main navigation">
    <div class="site-nav__inner">
      <a href="index.html" class="site-nav__logo" aria-label="YamYam Berlin Home">
        <img src="images/logos/YY_Logo_Red.svg" alt="YamYam Berlin">
      </a>
      <div class="site-nav__menu">
        <ul class="site-nav__links site-nav__links--left" role="list">
          <li class="mobile-only"><a href="index.html">Home</a></li>
          <li><a href="menue.html" class="active">Menue</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="jobs.html">Jobs</a></li>
        </ul>
        <ul class="site-nav__links site-nav__links--right" role="list">
          <li><a href="https://app.resmio.com/yamyam-berlin/widget" target="_blank" rel="noopener">Reserve</a></li>
          <li><a href="https://wolt.com/en/deu/berlin/restaurant/yamyam" target="_blank" rel="noopener">Order Online</a></li>
          <li class="mobile-only"><a href="datenschutz.html">Impressum &amp; Datenschutz</a></li>
          <li>
            <a href="https://www.instagram.com/yamyamberlin" target="_blank" rel="noopener" class="site-nav__ig" aria-label="Instagram">
              <img src="images/icons/ig_icon.svg" alt="Instagram" width="28" height="28">
            </a>
          </li>
        </ul>
      </div>
      <button class="site-nav__burger" aria-label="Menu öffnen" aria-expanded="false">
        <img src="images/icons/burger.png" alt="">
      </button>
    </div>
  </nav>

  <main class="menu-pdf" role="main">
    <object class="menu-pdf__frame" data="menue.pdf#toolbar=0&amp;navpanes=0&amp;scrollbar=0&amp;view=FitH" type="application/pdf">
      <p class="menu-pdf__fallback">
        Dein Browser kann die PDF nicht direkt anzeigen.
        <a href="menue.pdf" target="_blank" rel="noopener">PDF herunterladen</a>.
      </p>
    </object>
  </main>

  <footer class="site-footer" role="contentinfo">
    <div class="site-footer__inner">
      <a href="index.html" class="site-footer__logo">
        <img src="images/logos/YY_Logo_Red.svg" alt="YamYam Berlin" height="32">
      </a>
      <p class="site-footer__copy">© Copyright 2026 YamYam Berlin GmbH</p>
      <span></span>
      <a href="datenschutz.html" class="site-footer__legal">Impressum &amp; Datenschutz</a>
    </div>
  </footer>

  <script>
    const burger = document.querySelector('.site-nav__burger');
    const navMenu = document.querySelector('.site-nav__menu');
    if (burger) {
      burger.addEventListener('click', function() {
        const open = navMenu.classList.toggle('open');
        this.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
    }
  </script>

  <script src="cookie-banner.js" defer></script>
</body>
</html>
